[project]
name = "pocketpal-backend"
version = "0.1.0"
description = "FastAPI backend for PocketPal / Personal Finance HQ"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
